<mat-sidenav-container class="layout">
  <mat-sidenav class="sidenav" [class.mini]="mini" mode="side" opened>
    <mat-toolbar class="sidenav-toolbar">
      <span class="logo" *ngIf="!mini">LumenForge</span>
      <button
        mat-icon-button
        (click)="toggleMini()"
        [matTooltip]="mini ? 'Expand sidebar' : 'Collapse sidebar'"
        matTooltipPosition="right"
      >
        <mat-icon>{{ mini ? "chevron_right" : "chevron_left" }}</mat-icon>
      </button>
    </mat-toolbar>

    <mat-divider></mat-divider>

    <div class="nav-section">
      <mat-nav-list>
        <a
          mat-list-item
          routerLink="/"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          [matTooltip]="mini ? 'Dashboard' : ''"
          matTooltipPosition="right"
        >
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle *ngIf="!mini">Dashboard</span>
        </a>

        <ng-container *ngIf="mini; else fullDevices">
          <a
            mat-list-item
            routerLink="/devices"
            routerLinkActive="active-link"
            [matTooltip]="'Devices'"
            matTooltipPosition="right"
          >
            <mat-icon matListItemIcon>inventory_2</mat-icon>
          </a>
        </ng-container>

        <ng-template #fullDevices>
          <mat-expansion-panel
            class="nav-expansion"
            [expanded]="devicesExpanded"
            (opened)="devicesExpanded = true"
            (closed)="devicesExpanded = false"
          >
            <mat-expansion-panel-header>
              <mat-panel-title>
                <mat-icon>inventory_2</mat-icon>
                <span>Devices</span>
              </mat-panel-title>
            </mat-expansion-panel-header>
            <mat-nav-list>
              <a mat-list-item routerLink="/devices" routerLinkActive="active-link">All Devices</a>
              <a mat-list-item routerLink="/categories" routerLinkActive="active-link">
                <mat-icon matListItemIcon>category</mat-icon>
                <span matListItemTitle>Categories</span>
              </a>
              <a mat-list-item routerLink="/maintenanceStatus" routerLinkActive="active-link">
                <mat-icon matListItemIcon>build</mat-icon>
                <span matListItemTitle>Maintenance Status</span>
              </a>
              <a mat-list-item routerLink="/vendors" routerLinkActive="active-link">
                <mat-icon matListItemIcon>store</mat-icon>
                <span matListItemTitle>Vendors</span>
              </a>
            </mat-nav-list>
          </mat-expansion-panel>
        </ng-template>

        <a
          mat-list-item
          routerLink="/settings"
          routerLinkActive="active-link"
          [matTooltip]="mini ? 'Settings' : ''"
          matTooltipPosition="right"
        >
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle *ngIf="!mini">Settings</span>
        </a>
      </mat-nav-list>
    </div>

    <div class="spacer"></div>

    <mat-divider></mat-divider>

    <mat-nav-list>
      <button
        mat-list-item
        type="button"
        (click)="onLogout()"
        [matTooltip]="mini ? 'Log Out' : ''"
        matTooltipPosition="right"
      >
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle *ngIf="!mini">Log Out</span>
      </button>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
