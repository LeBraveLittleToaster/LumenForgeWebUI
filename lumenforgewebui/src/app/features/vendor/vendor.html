<h1 class="table-header">Vendor Table</h1>
<section class="search-section">
  <form class="example-form" (ngSubmit)="onSearch()">
    <mat-form-field appearance="outline" class="example-full-width">
      <mat-label>Search</mat-label>
      <input matInput [formControl]="searchCtrl" enterkeyhint="search" placeholder="Search Term">
      @if (searchCtrl.value) {
        <button type="button" matIconButton class="clear-btn" matSuffix aria-label="Clear search" (click)="clearSearch()">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
  </form>
  <button matButton="outlined" (click)="openCreateDialog()">Create Vendor</button>
</section>
@if (dataSource.loading$ | async) {
  <div class="spinner-container">
    <mat-spinner></mat-spinner>
  </div>
}
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <ng-container matColumnDef="guid">
    <th mat-header-cell *matHeaderCellDef> GUID </th>
    <td mat-cell *matCellDef="let element"> {{element.vendorView.guid}} </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.vendorView.name}} </td>
  </ng-container>

  <ng-container matColumnDef="created_at">
    <th mat-header-cell *matHeaderCellDef> Created At </th>
    <td mat-cell *matCellDef="let element"> {{parseDate(element.vendorView.created_at)}} </td>
  </ng-container>

  <ng-container matColumnDef="updated_at">
    <th mat-header-cell *matHeaderCellDef> Updated At </th>
    <td mat-cell *matCellDef="let element"> {{parseDate(element.vendorView.updated_at)}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row class="mat-row" *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [length]="dataSource.getLength()" [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]"
  aria-label="Select page">
</mat-paginator>
