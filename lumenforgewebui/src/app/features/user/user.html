<h1 class="user-table-header">User Table</h1>
<section class="search-section">
  <form class="example-form" (ngSubmit)="onSearch()">
    <mat-form-field appearance="outline" class="example-full-width">
      <mat-label>Search</mat-label>
      <input matInput [formControl]="searchCtrl" enterkeyhint="search" placeholder="Search Term">
      @if (searchCtrl.value) {
      <button matIconButton="outlined" class="clear-btn" matSuffix aria-label="Clear search" (click)="clearSearch()">
        <mat-icon>close</mat-icon>
      </button>
      }
    </mat-form-field>
    <button type="submit" style="display:none"></button>
  </form>
  <button matButton="outlined" [routerLink]="['/admin/users/create']">Create User</button>
</section>
@if (dataSource.loading$ | async) {
<div class="spinner-container">
  <mat-spinner></mat-spinner>
</div>
}
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <ng-container matColumnDef="userKcId">
    <th mat-header-cell *matHeaderCellDef> User KC ID </th>
    <td mat-cell *matCellDef="let element"> {{element.userView.user_kc_id}} </td>
  </ng-container>

  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef> Username </th>
    <td mat-cell *matCellDef="let element"> {{element.userView.username}} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> E-Mail </th>
    <td mat-cell *matCellDef="let element"> {{element.userView.email}} </td>
  </ng-container>

  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef> First Name </th>
    <td mat-cell *matCellDef="let element"> {{element.userView.firstName}} </td>
  </ng-container>

  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef> Last Name </th>
    <td mat-cell *matCellDef="let element"> {{element.userView.lastName}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row class="mat-row" *matRowDef="let row; columns: displayedColumns;"
    [routerLink]="['/admin/users/', row.userView.user_kc_id]"></tr>
</table>
<mat-paginator [length]="dataSource.getLength()" [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]"
  aria-label="Select page">
</mat-paginator>
