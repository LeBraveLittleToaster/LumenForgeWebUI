<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Categories</h1>
      <p class="page-subtitle">Manage device category structure</p>
    </div>
  </div>

  <div class="content-card">
    <div class="card-toolbar">
      <form class="search-form" (ngSubmit)="onSearch()">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Search categories…</mat-label>
          <input matInput [formControl]="searchCtrl" enterkeyhint="search" placeholder="Category name">
          @if (searchCtrl.value) {
            <button type="button" matIconButton class="clear-btn" matSuffix aria-label="Clear" (click)="clearSearch()">
              <mat-icon>close</mat-icon>
            </button>
          }
        </mat-form-field>
      </form>
      <div class="page-header-actions">
        <button mat-flat-button (click)="openCreateDialog()">
          <mat-icon>add</mat-icon> Create Category
        </button>
      </div>
    </div>

    <app-data-table
      [dataSource]="dataSource"
      [columns]="columns"
      [loading$]="dataSource.loading$"
      [length$]="dataSource.total$"
      (page)="onPage($event)">
    </app-data-table>
  </div>
</div>
