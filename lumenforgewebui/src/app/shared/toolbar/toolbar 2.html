<div class="toolbar-wrapper">
  <mat-toolbar class="toolbar" [class.menu-open]="isMobileMenuOpen()">
    <div class="toolbar-content">
      <!-- Logo Section -->
      <div class="logo-section">
        <img id="logo" src="LumenForgeLogo.webp" alt="LumenForge Logo" class="logo" routerLink="/">
        <h1 id="toolbar-logo-title" routerLink="/">LumenForge</h1>
      </div>

      <!-- Desktop Navigation -->
      <span class="toolbar-spacer"></span>
      <nav class="nav-items-desktop">
        @if(isAuthenticated) {
          @for(item of navItems(); track item.route) {
            <span class="router-option" [routerLink]="item.route" routerLinkActive="active">
              {{ item.label }}
            </span>
          }
        }
      </nav>

      <span class="toolbar-spacer"></span>

      <!-- Mobile Menu Toggle -->
      <button mat-icon-button class="mobile-menu-toggle" (click)="toggleMobileMenu()" *ngIf="isAuthenticated">
        <mat-icon>{{ isMobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>

      <!-- Theme Toggle -->
      <button mat-icon-button (click)="theme.toggle()" [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'" class="theme-toggle">
        <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <!-- User Menu -->
      @if(isAuthenticated) {
        <button matIconButton [matMenuTriggerFor]="menu"><mat-icon>account_box</mat-icon></button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item routerLink="/admin" *ngIf="isAdmin">Go to Admin</button>
          <button mat-menu-item (click)="auth.logout()">Logout</button>
        </mat-menu>
      }@else {
        <button matIconButton class="login-btn" routerLink="/login">
          <mat-icon>login</mat-icon>
        </button>
      }
    </div>
  </mat-toolbar>

  <!-- Mobile Navigation Menu -->
  @if(isAuthenticated && isMobileMenuOpen()) {
    <nav class="nav-items-mobile">
      @for(item of navItems(); track item.route) {
        <a class="mobile-nav-item" [routerLink]="item.route" (click)="closeMobileMenu()">
          {{ item.label }}
        </a>
      }
    </nav>
  }
</div>

<main class="page" [class.menu-open-mobile]="isMobileMenuOpen()">
  <router-outlet></router-outlet>
</main>
