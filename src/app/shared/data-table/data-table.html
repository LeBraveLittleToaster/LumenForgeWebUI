@if (loading$ | async) {
  <div class="spinner-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
}

<table mat-table [dataSource]="dataSource">
  @for (col of columns; track col.key) {
    <ng-container [matColumnDef]="col.key">
      <th mat-header-cell *matHeaderCellDef>{{ col.header }}</th>
      <td mat-cell *matCellDef="let row">{{ col.cell(row) }}</td>
    </ng-container>
  }

  <ng-container matColumnDef="edit">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let row" class="delete-cell">
      <button mat-icon-button (click)="$event.stopPropagation(); editRow.emit(row)" aria-label="Edit row">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="delete">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let row" class="delete-cell">
      <button mat-icon-button class="delete-btn" (click)="onDeleteClick($event, row)" aria-label="Delete row">
        <mat-icon>delete_outline</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row
    [class.clickable-row]="!!rowRouterLink"
    *matRowDef="let row; columns: displayedColumns"
    [routerLink]="rowRouterLink ? rowRouterLink(row) : null">
  </tr>
</table>

<mat-paginator
  [length]="(length$ | async) ?? 0"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  aria-label="Select page"
  (page)="page.emit($event)">
</mat-paginator>
