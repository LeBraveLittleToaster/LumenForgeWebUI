<app-action-container
  title="Generate Invoice"
  description="Generate billing for the current rental period and assigned items.">
  @if (loading()) {
    <div class="action-state">
      <mat-spinner diameter="36"></mat-spinner>
      <p class="muted">Loading rental process context...</p>
    </div>
  } @else if (!process()) {
    <mat-card appearance="outlined" class="action-state">
      <mat-card-content><p>The action page could not be initialized.</p></mat-card-content>
    </mat-card>
  } @else {
    <div class="action-layout">
      <app-action-rental-card [process]="process()"></app-action-rental-card>

      <mat-card appearance="outlined">
        <mat-card-header><mat-card-title>Generate Invoice</mat-card-title></mat-card-header>
        <mat-card-content>
          @if (!isAvailable()) {
            <div class="availability-warning">
              <mat-icon>warning</mat-icon>
              <span>This action is not listed as currently available by the API. Submission is blocked.</span>
            </div>
          }
          <div class="generic-form">
            <mat-form-field appearance="outline">
              <mat-label>Due date override</mat-label>
              <input matInput type="date" [formControl]="dueDateOverride" />
            </mat-form-field>
          </div>
        </mat-card-content>
        <mat-card-actions align="end">
          <button mat-button [routerLink]="['/rental', processGuid]">Cancel</button>
          <button mat-flat-button type="button" [disabled]="submitting() || !isAvailable()" (click)="submit()">
            Generate Invoice
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  }
</app-action-container>
