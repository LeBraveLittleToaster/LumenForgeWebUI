<div class="page-container">
	<div class="page-header">
		<div>
			<h1 class="page-title">Maintenance Backlog</h1>
			<p class="page-subtitle">Track unresolved and historical maintenance items.</p>
		</div>
		<div class="page-header-actions">
			@if (canManageStatuses) {
				<button mat-stroked-button (click)="openStatusManagerDialog()">
					<mat-icon>settings</mat-icon>
					Manage Statuses
				</button>
			}
			@if (canCreateBacklog) {
				<button mat-flat-button (click)="openCreateBacklogDialog()">
					<mat-icon>add</mat-icon>
					Create Backlog
				</button>
			}
		</div>
	</div>

	<div class="content-card">
		<div class="card-toolbar">
			<form class="search-form" (ngSubmit)="onSearch()">
				<mat-form-field appearance="outline" subscriptSizing="dynamic">
					<mat-label>Search backlog...</mat-label>
					<input matInput [formControl]="searchCtrl" enterkeyhint="search" placeholder="Issue summary or description">
					@if (searchCtrl.value) {
						<button type="button" matIconButton class="clear-btn" matSuffix aria-label="Clear" (click)="clearSearch()">
							<mat-icon>close</mat-icon>
						</button>
					}
				</mat-form-field>
			</form>

			<mat-form-field appearance="outline" class="status-field" subscriptSizing="dynamic">
				<mat-label>Status</mat-label>
				<mat-select [formControl]="statusCtrl" (selectionChange)="onFiltersChanged()">
					<mat-option [value]="null">All statuses</mat-option>
					@for (status of statuses; track status.uuid) {
						<mat-option [value]="status.uuid">{{ status.name }}</mat-option>
					}
				</mat-select>
			</mat-form-field>

			<mat-checkbox [formControl]="unresolvedOnlyCtrl" (change)="onFiltersChanged()">
				Unresolved only
			</mat-checkbox>
		</div>

		<app-data-table
			[dataSource]="dataSource"
			[columns]="columns"
			[loading$]="dataSource.loading$"
			[length$]="dataSource.total$"
			[rowRouterLink]="rowRouterLink"
			[canDelete]="canDeleteBacklog"
			(deleteRow)="onDeleteRow($event)"
			(page)="onPage($event)">
		</app-data-table>
	</div>
</div>
