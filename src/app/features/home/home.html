<div class="home-hero">
  <div class="home-hero-inner">
    <img src="LumenForgeLogo.webp" alt="LumenForge" class="home-logo" />
    <h1 class="home-title">Welcome to LumenForge</h1>
    @if (isAuthenticated) {
      <p class="home-cta-copy">
        Ready to get equipment moving? Create a rental request in seconds and we will route it to the right team.
      </p>
      <button type="button" class="home-cta-button" (click)="createRentalRequest()">
        Create Rental Request
      </button>
    }
    <p class="home-subtitle">
      Hello, <strong>{{ firstName }} {{ lastName }}</strong>.
      Manage your inventory, users, and operations from one place.
    </p>
  </div>
</div>
